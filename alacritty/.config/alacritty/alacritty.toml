[colors.selection]
text = "#C8CCD4"
background = "#323844"

[colors.search]
matches = { foreground = "#1E2229", background = "#E5C07B" }
focused_match = { foreground = "#1E2229", background = "#E56B73" }

[colors.hints]
start = { foreground = "#1E2229", background = "#61AFEF" }
end   = { foreground = "#1E2229", background = "#56B6C2" }

[colors.normal]
black   = "#1E2229"
red     = "#E56B73"
green   = "#7EC699"
yellow  = "#E5C07B"
