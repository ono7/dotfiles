[general]
live_config_reload = true
working_directory = "None"

# ==========================================
# CUSTOM PAPER PALETTE (LIGHT / ANTI-GLARE)
# ==========================================

[colors.primary]
background = "#F2EFE9"
foreground = "#38414D"

[colors.cursor]
text = "#F2EFE9"
cursor = "#D97736"

[colors.vi_mode_cursor]
text = "#F2EFE9"
cursor = "#996E14"

[colors.selection]
text = "#38414D"
background = "#D5CFC4"

[colors.search]
matches = { foreground = "#F2EFE9", background = "#996E14" }
focused_match = { foreground = "#F2EFE9", background = "#B85C38" }

[colors.hints]
start = { foreground = "#F2EFE9", background = "#3B6EA8" }
end   = { foreground = "#F2EFE9", background = "#2D7D8A" }

[colors.normal]
black   = "#E6E2DA"
red     = "#C4434B"
green   = "#4A7A59"
yellow  = "#996E14"
blue    = "#3B6EA8"
magenta = "#5C6A7B"
cyan    = "#2D7D8A"
white   = "#38414D"

[colors.bright]
black   = "#7B8A9C"
red     = "#C4434B"
green   = "#3A6146"
yellow  = "#7A570F"
blue    = "#2C5482"
magenta = "#734A7A"
cyan    = "#21606B"
white   = "#1A1F26"

[colors.dim]
black   = "#E6E2DA"
red     = "#C4434B"
green   = "#4A7A59"
yellow  = "#996E14"
blue    = "#3B6EA8"
magenta = "#5C6A7B"
cyan    = "#2D7D8A"
white   = "#7B8A9C"

# ==========================================
# TERMINAL, FONT & WINDOW SETTINGS
# ==========================================

[terminal]
osc52 = "CopyPaste"

[terminal.shell]
args = ["--login"]
program = "/bin/zsh"

[cursor]
style = { blinking = "Always" }
blink_interval = 300
blink_timeout = 0

[debug]
log_level = "Off"
persistent_logging = false
print_events = false
render_timer = false

[env]
TERM = "alacritty"

[font]
size = 22.0

[font.normal]
family = "IosevkaTerm Nerd Font"
style = "Bold"

[font.offset]
x = 0
# 11 = 1.5x line heigth
y = 11

[font.glyph_offset]
x = 0
y = 0

[window]
decorations = "Transparent"
decorations_theme_variant = "Light"
dynamic_padding = false
position = "None"
startup_mode = "Windowed"
option_as_alt = "both"

[window.dimensions]
columns = 82
lines = 28

[window.padding]
x = 0
y = 0

[scrolling]
history = 15000
multiplier = 3

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
bindings = [
  { action = "PasteSelection", mouse = "Middle" }
]

[keyboard]
bindings = [
  { key = "-",         mods = "Command",       action = "DecreaseFontSize" },
  { key = "=",         mods = "Command",       action = "IncreaseFontSize" },
  { key = "A",         mods = "Command",       chars   = "\u0001" },
  { key = "Back",      mods = "Alt",           chars   = "\u0017" },
  { key = "Back",      mods = "Command",       chars   = "\u0017" },
  { key = "W",         mods = "Command",       chars   = "\u0017" },
  { key = "B",         mods = "Command",       chars   = "\u0002" },
  { key = "C",         mods = "Command",       chars   = "\u0003" },
  { key = "D",         mods = "Command",       chars   = "\u0004" },
  { key = "E",         mods = "Command",       chars   = "\u0005" },
  { key = "F",         mods = "Command",       chars   = "\u0006" },
  { key = "F",         mods = "Command|Shift", action = "ToggleFullscreen" },
  { key = "G",         mods = "Command",       chars   = "\u0007" },
  { key = "H",         mods = "Command",       action = "ReceiveChar" },
  { key = "H",         mods = "Command",       chars   = "\u0008" },
  { key = "H",         mods = "Command|Shift", action = "SelectPreviousTab" },
  { key = "I",         mods = "Command",       chars   = "\u001b[105;5u" },
  { key = "J",         mods = "Command",       chars   = "\u000a" },
  { key = "K",         mods = "Command",       chars   = "\u000b" },
  { key = "K",         mods = "Command|Shift", chars   = "\u000c" },
  { key = "L",         mods = "Command",       chars   = "\u000c" },
  { key = "L",         mods = "Command|Shift", action = "SelectNextTab" },
  { key = "LBracket",  mods = "Command",       chars   = "\u001b" },
  { key = "N",         mods = "Command",       chars   = "\u000e" },
  { key = "M",         mods = "Command",       chars   = "\u001bZ" },
  { key = "O",         mods = "Command",       chars   = "\u000f" },
  { key = "P",         mods = "Command",       chars   = "\u0010" },
  { key = "Q",         mods = "Command",       action = "None" },
  { key = "Q",         mods = "Command",       chars   = "\u0011" },
  { key = "Comma",     mods = "Control",       chars   = "\u001b[44;5u" },
  { key = "R",         mods = "Command",       chars   = "\u0012" },
  { key = "T",         mods = "Command",       chars   = "\u0014" },
  { key = "Y",         mods = "Command",       chars   = "\u0019" },
  { key = "RBracket",  mods = "Command",       chars   = "\u001d" },
  { key = "S",         mods = "Command",       chars   = "\u0013" },
  { key = "Slash",     mods = "Command",       chars   = "\u001f" },
  { key = "Backslash", mods = "Command",       chars   = "\u001c" },
  { key = "Space",     mods = "Command|Shift", mode   = "~Search", action = "ToggleViMode" },
  { key = "Space",     mods = "Command",       chars   = "\u0000" },
  { key = "V",         mods = "Command",       chars   = "\u0016" },
  { key = "V",         mods = "Command|Shift", action = "Paste" },
  { key = "V",         mods = "Control|Shift", action = "Paste" },
  { key = "W",         mods = "Command|Shift", action = "Quit" },
  { key = "X",         mods = "Command",       chars   = "\u0018" },
  { key = "Z",         mods = "Command",       chars   = "\u001A" },
  { key = "Key1",      mods = "Command",       chars   = "\u001b1" },
  { key = "Key2",      mods = "Command",       chars   = "\u001b2" },
  { key = "Key3",      mods = "Command",       chars   = "\u001b3" },
  { key = "Key4",      mods = "Command",       chars   = "\u001b4" },
  { key = "Key9",      mods = "Command",       chars   = "\u001b1" },
  { key = "Key0",      mods = "Command",       chars   = "\u001b2" },
  { key = "T",         mods = "Command|Shift", action = "CreateNewTab" },
]

[hints]
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https?://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
command = "open"
hyperlinks = true
post_processing = true
mouse.enabled = true
