# WSL alacritty location
# /mnt/c/Users/jl78/AppData/Roaming/alacritty/alacritty.toml

[general]
live_config_reload = true
working_directory = "None"

# ==========================================
# CUSTOM PAPER PALETTE (LIGHT / ANTI-GLARE)
# ==========================================

[colors]
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#F2EFE9"
foreground = "#38414D"
dim_foreground = "#7B8A9C"
bright_foreground = "#1A1F26"

[colors.cursor]
cursor = "#D97736"
text = "#F2EFE9"

[colors.vi_mode_cursor]
cursor = "#996E14"
text = "#F2EFE9"

[colors.selection]
text = "#38414D"
background = "#D5CFC4"

[colors.search.matches]
foreground = "#F2EFE9"
background = "#996E14"

[colors.search.focused_match]
foreground = "#F2EFE9"
background = "#B85C38"

[colors.footer_bar]
foreground = "#38414D"
background = "#E6E2DA"

[colors.hints.start]
foreground = "#F2EFE9"
background = "#3B6EA8"

[colors.hints.end]
foreground = "#F2EFE9"
background = "#2D7D8A"

[colors.normal]
black   = "#E6E2DA"
red     = "#C4434B"
green   = "#4A7A59"
yellow  = "#996E14"
blue    = "#3B6EA8"
magenta = "#5C6A7B"
cyan    = "#2D7D8A"
white   = "#38414D"

[colors.bright]
black   = "#7B8A9C"
red     = "#C4434B"
green   = "#3A6146"
yellow  = "#7A570F"
blue    = "#2C5482"
magenta = "#734A7A"
cyan    = "#21606B"
white   = "#1A1F26"

[colors.dim]
black   = "#E6E2DA"
red     = "#C4434B"
green   = "#4A7A59"
yellow  = "#996E14"
blue    = "#3B6EA8"
magenta = "#5C6A7B"
cyan    = "#2D7D8A"
white   = "#7B8A9C"

[[colors.indexed_colors]]
index = 16
color = "#B85C38"

[[colors.indexed_colors]]
index = 17
color = "#5C6A7B"

# ==========================================
# CURSOR & ENVIRONMENT
# ==========================================

[cursor]
blink_interval = 200
blink_timeout = 0
unfocused_hollow = true

[cursor.style]
blinking = "Never"
shape = "Block"

[debug]
log_level = "Off"
persistent_logging = false
print_events = false
render_timer = false

[env]
LC_CTYPE = "en_US.UTF-8"

# ==========================================
# FONT SETTINGS
# ==========================================

[font]
size = 13.0

[font.normal]
family = "Iosevka Custom"

[font.offset]
x = 0
y = 11

[font.glyph_offset]
x = 0
y = 0

# ==========================================
# KEYBOARD BINDINGS
# ==========================================

[keyboard]
bindings = [
  { key = "-",      mods = "Control",       action = "ReceiveChar" },
  { key = "=",      mods = "Control",       action = "ReceiveChar" },
  { key = "-",      mods = "Control",       action = "DecreaseFontSize" },
  { key = "=",      mods = "Control",       action = "IncreaseFontSize" },
  { key = "A",      mods = "Control",       chars   = "\u0001" },
  { key = "Back",   mods = "Alt",           chars   = "\u0017" },
  { key = "Back",   mods = "Control",       chars   = "\u0017" },
  { key = "F",      mods = "Control|Shift", action = "ToggleFullscreen" },
  { key = "H",      mods = "Control",       action = "ReceiveChar" },
  { key = "E",      mods = "Control",       action = "ReceiveChar" },
  { key = "H",      mods = "Control|Shift", action = "SelectPreviousTab" },
  { key = "I",      mods = "Control",       chars   = "\u001b[105;5u" },
  { key = "L",      mods = "Control|Shift", action = "SelectNextTab" },
  { key = "Q",      mods = "Control",       action = "ReceiveChar" },
  { key = "Escape", mods = "Control",       action = "None" },
  { key = "Space",  mods = "Control|Shift", mode   = "~Search", action = "ToggleViMode" },
  { key = "Space",  mods = "Control",       chars   = "\u0000" },
  { key = "V",      mods = "Control|Shift", action = "Paste" },
  { key = "W",      mods = "Control|Shift", action = "Quit" },
  { key = "Key1",   mods = "Control",       chars   = "\u001b1" },
  { key = "Key2",   mods = "Control",       chars   = "\u001b2" },
  { key = "Key3",   mods = "Control",       chars   = "\u001b3" },
  { key = "Key4",   mods = "Control",       chars   = "\u001b4" },
  { key = "Key9",   mods = "Control",       chars   = "\u001b1" },
  { key = "Key0",   mods = "Control",       chars   = "\u001b2" },
]

# ==========================================
# MOUSE, SCROLLING & SELECTION
# ==========================================

[mouse]
hide_when_typing = true

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Right"

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

# ==========================================
# TERMINAL & WINDOW SETTINGS
# ==========================================

[terminal]
shell = "wsl.exe ~"

[window]
decorations = "full"
decorations_theme_variant = "Light"
dynamic_padding = true
dynamic_title = true
opacity = 1.0
startup_mode = "Maximized"

[window.dimensions]
columns = 82
lines = 28

[window.padding]
x = 5
y = 5
