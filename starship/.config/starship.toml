# Starship configuration - Compact & Elegant (Google Dark Minimal Palette)
# Location: ~/.config/starship.toml

# NOTE(jlima): Two-line compact pipeline retaining functional devicons and system markers.
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$golang\
$rust\
$nodejs\
$docker_context\
$package\
$cmd_duration\
$line_break\
$character"""

add_newline = false

# OS Symbol
[os]
disabled = false
style = "fg:#7F8996"
format = "[$symbol ]($style)"

[os.symbols]
Linux = "󰌽"
Ubuntu = "󰕈"
Debian = "󰣚"
Arch = "󰣇"
Fedora = "󰣛"
Macos = "󰀵"
Windows = "󰍲"

# Username (remote/root only to preserve horizontal density)
[username]
show_always = false
style_user = "fg:#D4B976"
style_root = "bold fg:#F28B82"
format = "[$user]($style)[@](fg:#7F8996)"

# Hostname
[hostname]
ssh_only = true
style = "fg:#8AB4F8"
format = "[$hostname]($style) "

# Directory
[directory]
style = "bold fg:#8AB4F8"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1
read_only = " 󰌾"
read_only_style = "fg:#F28B82"

[directory.substitutions]
"Documents" = "󰈙 Docs"
"Downloads" = "󰈙 Downloads"
"Music" = "󰝚 Music"
"Pictures" = "󰋩 Pics"
"Developer" = "󰲋 Dev"
"~" = "󰋜 ~"

# Git Branch
[git_branch]
symbol = " "
style = "fg:#C58AF9"
format = "[$symbol$branch]($style) "

# Git Status
[git_status]
style = "fg:#FA903E"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = " s"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Language / Tool Indicators
# NOTE(jlima): Retains original Nerd Font symbols while stripping noisy parenthetical wrappers.
[python]
symbol = " "
style = "fg:#D4B976"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "fg:#78D9EC"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "fg:#FA903E"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "fg:#A3BE8C"
format = "[$symbol$version]($style) "

[docker_context]
symbol = "󰡨 "
style = "fg:#8AB4F8"
format = "[$symbol$context]($style) "
only_with_files = true

[package]
symbol = "📦 "
style = "fg:#7F8996"
format = "[$symbol$version]($style) "

# Command duration
[cmd_duration]
min_time = 2000
style = "italic fg:#7F8996"
format = "[$duration]($style) "

# Line break
[line_break]
disabled = false

[character]
disabled = false
# NOTE(jlima): Muted spine dot (#7F8996) with sharp active chevron.
success_symbol = "[·](fg:#7F8996)[❯](bold fg:#A3BE8C) "
error_symbol   = "[·](fg:#7F8996)[❯](bold fg:#F28B82) "
vimcmd_symbol  = "[·](fg:#7F8996)[❮](bold fg:#D4B976) "
vimcmd_replace_one_symbol = "[·](fg:#7F8996)[❮](bold fg:#C58AF9) "
vimcmd_replace_symbol     = "[·](fg:#7F8996)[❮](bold fg:#C58AF9) "
vimcmd_visual_symbol      = "[·](fg:#7F8996)[❮](bold fg:#FA903E) "
