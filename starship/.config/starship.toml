# Starship configuration - Modern Minimal (Google Dark Minimal Palette)
# Location: ~/.config/starship.toml

# NOTE(jlima): Two-line layout. Line 1 hosts contextual state; Line 2 provides clean command input.
format = """
$os\
$directory\
$git_branch\
$git_status\
$python\
$golang\
$rust\
$nodejs\
$docker_context\
$kubernetes\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[os]
disabled = false
style = "fg:#7F8996"
format = "[$symbol]($style) "

[os.symbols]
Linux = "󰌽"
Ubuntu = "󰕈"
Debian = "󰣚"
Arch = "󰣇"
Fedora = "󰣛"
Macos = "󰀵"
Windows = "󰍲"

[directory]
style = "fg:#8AB4F8 bold"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:#F28B82"

[git_branch]
symbol = " "
style = "fg:#C58AF9"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:#FA903E"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "~${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘"

[python]
symbol = " "
style = "fg:#D4B976"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "fg:#78D9EC"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:#FA903E"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "󰌞 "
style = "fg:#A3BE8C"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "fg:#8AB4F8"
format = "[$symbol$context]($style) "
only_with_files = true

[kubernetes]
symbol = "󱃾 "
style = "fg:#78D9EC"
format = "[$symbol$context]($style) "
disabled = false

[cmd_duration]
min_time = 2000
style = "fg:#7F8996 italic"
format = "[$duration]($style) "

[line_break]
disabled = false

[character]
disabled = false
# NOTE(jlima): Maps shell prompt character directly to editor mode highlights.
success_symbol = "[❯](bold fg:#A3BE8C)"
error_symbol = "[❯](bold fg:#F28B82)"
vimcmd_symbol = "[❮](bold fg:#D4B976)"
vimcmd_replace_one_symbol = "[❮](bold fg:#C58AF9)"
vimcmd_replace_symbol = "[❮](bold fg:#C58AF9)"
vimcmd_visual_symbol = "[❮](bold fg:#FA903E)"
