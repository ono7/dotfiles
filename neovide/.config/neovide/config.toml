fork = true
# frame = "full"
# frame = "buttonless"
# frame = "transparent"
frame = "full"
idle = true
maximized = false
# mouse-cursor-icon = "arrow"
# neovim-bin = "/Users/jlima/.local/bin/nvim" # in reality found dynamically on $PATH if unset
system-native-tabs = true
system-tab-prev-hotkey = "ctrl+1"
system-tab-next-hotkey = "ctrl+2"
