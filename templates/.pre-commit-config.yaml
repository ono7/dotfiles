---
# Globally exclude any file inside .collections/ or collections/
exclude: '(^|/)\.collections/|(^|/)collections/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Local system hooks for tools
  - repo: local
    hooks:
      - id: ruff
        name: Ruff Linter
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: Ruff Formatter
        entry: ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ansible-lint
        name: Ansible Lint
        entry: ansible-lint
        language: system
        types: [yaml]

      - id: ctags
        name: Generate Ctags
        entry: ctags -R -f tags .
        language: system
        pass_filenames: false
        always_run: true
